<!doctype html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="__CSRF__"><title>Oasis · Atelier du simulateur</title><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/admin.js" defer></script></head>

<aside class="sidebar"><a class="brand" href="/admin"><span class="brand-mark">O</span><span>Oasis<small>ATELIER DU SIMULATEUR</small></span></a><div class="side-label">ESPACE ÉTUDIANT</div><div id="accounts"></div><button id="create-account" class="side-add">+ Créer un compte</button><div class="side-label">ENVIRONNEMENT</div><nav id="global-nav"><button data-global="settings">Réglages du serveur</button><button data-global="events">Sessions & activité</button><button data-global="coverage">Couverture des routes</button></nav><div class="side-bottom"><span class="status-dot"></span> Serveur local <a href="/" target="_blank" rel="noopener">Ouvrir Oasis ↗</a></div></aside>
